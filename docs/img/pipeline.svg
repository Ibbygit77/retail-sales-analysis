<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212" role="img" aria-labelledby="t d">
  <title id="t">Data pipeline</title>
  <desc id="d">Five steps: a Python script generates the data, which is saved as three CSV files, loaded into a SQLite database, analysed with SQL, and presented in a web dashboard on GitHub Pages.</desc>
  <style>
    .bg { fill: #f9f9f7; }
    .box { fill: #ffffff; stroke: #dddcd5; stroke-width: 1; }
    .badge { fill: #2a78d6; }
    .badge-t { fill: #ffffff; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .icon { fill: none; stroke: #2a78d6; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-bar { stroke: #2a78d6; stroke-width: 3.5; stroke-linecap: round; }
    .arrow { fill: none; stroke: #898781; stroke-width: 1.8; }
    .head { fill: #898781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121211; }
      .box { fill: #1a1a19; stroke: #383835; }
      .badge { fill: #3987e5; }
      .title { fill: #f0efec; }
      .sub { fill: #c3c2b7; }
      .icon { stroke: #5598e7; }
      .icon-bar { stroke: #5598e7; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="212" rx="16"/>

  <!-- 1 Generate -->
  <g transform="translate(24,28)">
    <rect class="box" width="164" height="156" rx="12"/>
    <circle class="badge" cx="20" cy="20" r="11"/><text class="badge-t" x="20" y="24" text-anchor="middle">1</text>
    <polyline class="icon" points="74,38 64,48 74,58"/>
    <polyline class="icon" points="90,38 100,48 90,58"/>
    <line class="icon" x1="86" y1="35" x2="78" y2="61"/>
    <text class="title" x="82" y="98" text-anchor="middle">Generate data</text>
    <text class="sub" x="82" y="120" text-anchor="middle">Python script</text>
    <text class="sub" x="82" y="137" text-anchor="middle">20,612 order lines</text>
  </g>
  <line class="arrow" x1="194" y1="106" x2="212" y2="106" marker-end="url(#arr)"/>

  <!-- 2 CSV -->
  <g transform="translate(218,28)">
    <rect class="box" width="164" height="156" rx="12"/>
    <circle class="badge" cx="20" cy="20" r="11"/><text class="badge-t" x="20" y="24" text-anchor="middle">2</text>
    <path class="icon" d="M66,32 h12 l8,8 v22 h-20 z"/>
    <path class="icon" d="M72,30 v-4 h12 l8,8 v22 h-6" opacity="0.55"/>
    <path class="icon" d="M78,32 v8 h8"/>
    <line class="icon" x1="71" y1="48" x2="81" y2="48"/>
    <line class="icon" x1="71" y1="54" x2="81" y2="54"/>
    <text class="title" x="82" y="98" text-anchor="middle">Raw files</text>
    <text class="sub" x="82" y="120" text-anchor="middle">3 CSV tables:</text>
    <text class="sub" x="82" y="137" text-anchor="middle">stores, products, orders</text>
  </g>
  <line class="arrow" x1="388" y1="106" x2="406" y2="106" marker-end="url(#arr)"/>

  <!-- 3 Database -->
  <g transform="translate(412,28)">
    <rect class="box" width="164" height="156" rx="12"/>
    <circle class="badge" cx="20" cy="20" r="11"/><text class="badge-t" x="20" y="24" text-anchor="middle">3</text>
    <ellipse class="icon" cx="82" cy="34" rx="16" ry="5"/>
    <path class="icon" d="M66,34 v26 a16,5 0 0 0 32,0 v-26"/>
    <path class="icon" d="M66,47 a16,5 0 0 0 32,0"/>
    <text class="title" x="82" y="98" text-anchor="middle">Database</text>
    <text class="sub" x="82" y="120" text-anchor="middle">SQLite tables with</text>
    <text class="sub" x="82" y="137" text-anchor="middle">keys and relationships</text>
  </g>
  <line class="arrow" x1="582" y1="106" x2="600" y2="106" marker-end="url(#arr)"/>

  <!-- 4 SQL -->
  <g transform="translate(606,28)">
    <rect class="box" width="164" height="156" rx="12"/>
    <circle class="badge" cx="20" cy="20" r="11"/><text class="badge-t" x="20" y="24" text-anchor="middle">4</text>
    <circle class="icon" cx="78" cy="44" r="12"/>
    <line class="icon" x1="87" y1="53" x2="98" y2="64"/>
    <line class="icon-bar" x1="73" y1="49" x2="73" y2="45"/>
    <line class="icon-bar" x1="78" y1="49" x2="78" y2="40"/>
    <line class="icon-bar" x1="83" y1="49" x2="83" y2="43"/>
    <text class="title" x="82" y="98" text-anchor="middle">SQL analysis</text>
    <text class="sub" x="82" y="120" text-anchor="middle">Joins, views, window</text>
    <text class="sub" x="82" y="137" text-anchor="middle">functions, aggregation</text>
  </g>
  <line class="arrow" x1="776" y1="106" x2="794" y2="106" marker-end="url(#arr)"/>

  <!-- 5 Dashboard -->
  <g transform="translate(800,28)">
    <rect class="box" width="164" height="156" rx="12"/>
    <circle class="badge" cx="20" cy="20" r="11"/><text class="badge-t" x="20" y="24" text-anchor="middle">5</text>
    <rect class="icon" x="61" y="30" width="42" height="28" rx="3"/>
    <line class="icon" x1="82" y1="58" x2="82" y2="64"/>
    <line class="icon" x1="73" y1="65" x2="91" y2="65"/>
    <line class="icon-bar" x1="70" y1="52" x2="70" y2="47"/>
    <line class="icon-bar" x1="78" y1="52" x2="78" y2="41"/>
    <line class="icon-bar" x1="86" y1="52" x2="86" y2="44"/>
    <line class="icon-bar" x1="94" y1="52" x2="94" y2="38"/>
    <text class="title" x="82" y="98" text-anchor="middle">Dashboard</text>
    <text class="sub" x="82" y="120" text-anchor="middle">HTML, CSS, JavaScript</text>
    <text class="sub" x="82" y="137" text-anchor="middle">on GitHub Pages</text>
  </g>
</svg>
